name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev pkg-config \
            libmtdev-dev \
            xvfb \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app main.py service

      - name: Smoke-test Android UI imports
        env:
          KIVY_NO_ARGS: "1"
          KIVY_NO_CONSOLELOG: "1"
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" \
            python -c "from app.ui.android.app import YouTubeDownloaderApp; print('Android UI imports OK:', YouTubeDownloaderApp.__name__)"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" python -m pytest -q

  desktop-build:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build desktop executable
        run: python -m PyInstaller --clean --noconfirm youtube_downloader.spec

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v6
        with:
          name: youtube-downloader-desktop
          path: dist/
          if-no-files-found: error

  android-build:
    runs-on: ubuntu-22.04
    needs: test
    env:
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip \
            openjdk-17-jdk \
            autoconf automake libtool libtool-bin libltdl-dev m4 \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            liblzma-dev libsqlite3-dev
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.6.0 cython==0.29.37
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> "$GITHUB_PATH"

      - name: Verify Java
        run: |
          java -version
          javac -version

      - name: Install modern Android command-line tools
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/build-tools/35.0.1" >> "$GITHUB_PATH"

      - name: Install Android SDK packages and accept licenses
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "cmdline-tools;latest"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true

      - name: Configure Buildozer to use prepared Android SDK
        run: |
          mkdir -p "$HOME/.buildozer/android/platform"
          ln -sfn "$ANDROID_SDK_ROOT" "$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/tools/bin"
          ln -sfn "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
          rm -rf .buildozer bin

      - name: Verify Android SDK tooling
        run: |
          sdkmanager --version
          "$ANDROID_SDK_ROOT/platform-tools/adb" version
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.1/aidl"
          test -x "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
          "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" --version

      - name: Build Android debug APK
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
        run: |
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: youtube-downloader-android-debug
          path: bin/*.apk
          if-no-files-found: error
